# MySQL Profile Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/authentica_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2276
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional external secrets import (untracked in git)
spring.config.import=optional:classpath:application-secrets.properties

# Groq AI Whisper Speech-to-Text
groq.api.key=${GROQ_API_KEY:}

# Cloudinary Evidence Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VirusTotal Threat Intelligence API
virustotal.api.key=${VIRUSTOTAL_API_KEY:}

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
