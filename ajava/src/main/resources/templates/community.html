<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Community threat intelligence — browse and contribute crowdsourced fraud and scam incident reports on Authentica.">
  <title>Threat Feed | Authentica</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/" class="nav-brand" aria-label="Authentica home">
        <div class="brand-icon" aria-hidden="true">A</div>
        Authentica
      </a>
      <div class="nav-links">
        <a href="/"          class="nav-link">Home</a>
        <a href="/scanner"   class="nav-link">Scanner</a>
        <a href="/community" class="nav-link active">Threat Feed</a>
      </div>
      <div class="nav-actions">
        <a href="/scanner" class="btn btn-primary btn-sm">Scanner</a>
      </div>
    </div>
  </nav>

  <div id="globalAlert" class="alert" style="display:none;position:fixed;top:70px;right:var(--sp-6);z-index:300;max-width:400px;"></div>

  <main>
    <div class="container">
      <div class="page-header" style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;">
        <div>
          <h1 class="page-title">Community Threat Feed</h1>
          <p class="page-subtitle">Crowdsourced fraud and scam reports verified by community consensus.</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('reportModal')">Submit report</button>
      </div>

      <div id="communityFeed">
        <div class="empty-state"><p>Loading reports…</p></div>
      </div>
    </div>
  </main>

  <!-- ── Submit Report Modal ────────────────────────────────── -->
  <div class="modal-overlay" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="modal" style="max-width:600px;">
      <div class="modal-header">
        <h2 class="modal-title" id="reportTitle">Submit incident report</h2>
        <button class="modal-close" onclick="closeModal('reportModal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="repAuthor">Author / Reporter Name <span class="text-muted" style="font-weight:normal;">(optional)</span></label>
          <input type="text" id="repAuthor" class="form-control" placeholder="e.g. Rahul Sharma or Anonymous">
        </div>
        <div class="form-group">
          <label class="form-label" for="repType">Category</label>
          <select id="repType" class="form-control">
            <option value="SMS">SMS / Smishing</option>
            <option value="CALL">Fraud voice call</option>
            <option value="URL">Phishing website / link</option>
            <option value="UPI">UPI / Payment fraud</option>
            <option value="EMAIL">Phishing email</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="repTitle">Incident title</label>
          <input type="text" id="repTitle" class="form-control" placeholder="e.g. Fake SBI netbanking link shared via WhatsApp">
        </div>
        <div class="form-group">
          <label class="form-label" for="repTarget">Suspicious phone / URL / UPI ID</label>
          <input type="text" id="repTarget" class="form-control" placeholder="+91 98765 43210 or http://example-phish.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="repDesc">Incident details</label>
          <textarea id="repDesc" class="form-control" placeholder="Describe the scam — what happened, what was claimed, what you were asked to do…"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);">
          <div class="form-group">
            <label class="form-label" for="repCity">City</label>
            <input type="text" id="repCity" class="form-control" placeholder="Ahmedabad">
          </div>
          <div class="form-group">
            <label class="form-label" for="repState">State</label>
            <input type="text" id="repState" class="form-control" placeholder="Gujarat">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="repTags">Tags <span class="text-muted" style="font-weight:normal;">(comma-separated)</span></label>
          <input type="text" id="repTags" class="form-control" placeholder="electricity scam, urgent, impersonation">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('reportModal')">Cancel</button>
        <button class="btn btn-primary" onclick="submitReport()">Submit</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2026 Authentica Inc. All rights reserved.</p>
      <div class="footer-links">
        <a href="/scanner">Scanner</a>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadCommunityFeed);

    async function submitReport() {
      const reporterName     = document.getElementById('repAuthor').value.trim() || 'Anonymous';
      const type             = document.getElementById('repType').value;
      const title            = document.getElementById('repTitle').value;
      const targetIdentifier = document.getElementById('repTarget').value;
      const description      = document.getElementById('repDesc').value;
      const city             = document.getElementById('repCity').value;
      const state            = document.getElementById('repState').value;
      const tags             = document.getElementById('repTags').value;

      if (!title || !description) {
        showAlert('Please provide at least a title and description.', 'warn');
        return;
      }

      try {
        await apiFetch('/community/reports', {
          method: 'POST',
          body: JSON.stringify({ reporterName, type, title, targetIdentifier, description, city, state, tags })
        });
        showAlert('Report submitted for review.', 'success');
        closeModal('reportModal');
        loadCommunityFeed();
      } catch (err) { showAlert(err.message, 'danger'); }
    }
  </script>
</body>
</html>
